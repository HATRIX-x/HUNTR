# Railway config for the ADMIN service (separate from the public API).
# Create a SECOND Railway service in the same project, Root Directory = "cloud", and point its
# "Config as code" path at this file (Service → Settings → Config-as-code → cloud/railway.admin.toml).
# It shares the same repo + Postgres as the API but runs its own process on its own domain.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn app.admin_app:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
