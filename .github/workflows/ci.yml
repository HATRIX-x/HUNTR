name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every tool (catches syntax + latent errors)
        run: python -m compileall -q tools huntr-server.py
      - name: Run the test suite (unit + server hardening integration)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  e2e:
    # Browser-level regression gate: boots huntr-server.py and drives the real
    # dashboard in Chromium (see e2e/tests/huntr.spec.ts). Keeps "crashes on
    # garbage input" and the API-base/port fix from ever regressing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + browser
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E (auto-boots the server)
        working-directory: e2e
        run: npx playwright test --reporter=line
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
