name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every tool (catches syntax + latent errors)
        run: python -m compileall -q tools huntr-server.py
      - name: Run the test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
