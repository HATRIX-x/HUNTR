<title>HUNTR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#080C14;--bg2:#0C1020;--bg3:#101524;
  --text:#F1F3F9;--text2:#8892A4;--text3:#4A5568;--white:#F8FAFF;
  --accent:#3B82F6;--accent2:rgba(59,130,246,0.10);--accent3:rgba(59,130,246,0.28);
  --gold:#F59E0B;--violet:#A78BFA;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;--cyan:#06B6D4;--lime:#84CC16;--orange:#F97316;
  --sev-c:#EF4444;--sev-cg:rgba(239,68,68,0.12);
  --sev-h:#F97316;--sev-hg:rgba(249,115,22,0.12);
  --sev-m:#FBBF24;--sev-mg:rgba(251,191,36,0.12);
  --sev-l:#60A5FA;--sev-lg:rgba(96,165,250,0.12);
  --sev-i:#94A3B8;--sev-ig:rgba(148,163,184,0.10);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.10);--border3:rgba(255,255,255,0.16);
  --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --glass:rgba(255,255,255,0.03);--glass2:rgba(255,255,255,0.055);
  --glass-border:rgba(255,255,255,0.07);--glass-inset:rgba(255,255,255,0.03);
  --sheen:inset 0 1px 0 rgba(255,255,255,0.06);
  --shadow:0 20px 50px -20px rgba(0,0,0,0.65);
  --shadow-sm:0 8px 24px -12px rgba(0,0,0,0.5);
  --r:10px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
body{overflow:hidden;font-family:var(--sans);font-size:13px;line-height:1.5;}
::selection{background:rgba(59,130,246,0.3);color:#fff;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.bg-orbs,.orb,.orb1,.orb2,.orb3,.orb4,.orb5{display:none!important;}
@keyframes drift1{}@keyframes drift2{}@keyframes drift3{}
.grain{display:none;}
.glass-card,.table-glass,.stat-card,.scope-hero,.ws,.report-viewer,.modal,.gpanel,.asset-list,.count-tile,.info-card{
  background:var(--glass2);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow),var(--sheen);}
.app{display:flex;flex-direction:row;height:100vh;position:relative;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(8,12,20,0.9);border-bottom:1px solid var(--border);position:relative;z-index:10;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
.tb-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mark{width:22px;height:22px;}
.logo-txt{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--white);letter-spacing:-0.2px;}
.logo-txt span{color:var(--accent);}
.tb-sep,.tb-div{width:1px;height:18px;background:var(--border2);flex-shrink:0;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;flex:1;min-width:0;}
.bc-link{color:var(--text3);cursor:pointer;text-decoration:none;transition:color .15s;}
.bc-link:hover{color:var(--text);}
.bc-sep{color:var(--text3);opacity:.5;}
.bc-cur{color:var(--text);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ws-switch{position:relative;flex-shrink:0;}
.ws-btn{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:8px;cursor:pointer;
  background:var(--glass2);border:1px solid var(--border2);color:var(--white);
  font-family:var(--sans);font-size:12.5px;font-weight:500;max-width:280px;transition:border-color .15s,background .15s;}
.ws-btn:hover{border-color:var(--border3);background:rgba(255,255,255,0.07);}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);flex-shrink:0;}
.ws-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
.ws-meta{font-family:var(--mono);font-size:10px;color:var(--text3);flex-shrink:0;}
.ws-car{color:var(--text3);font-size:10px;flex-shrink:0;}
.ws-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;max-height:60vh;overflow-y:auto;z-index:1200;
  background:#0E1422;border:1px solid var(--border2);border-radius:12px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,0.8);padding:6px;}
.ws-item{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .12s;}
.ws-item:hover{background:rgba(255,255,255,0.05);}
.ws-item.on{background:var(--accent2);}
.ws-item.on .ws-i-name{color:var(--accent);}
.ws-i-name{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--white);}
.ws-i-meta{font-family:var(--mono);font-size:10px;color:var(--text3);}
.ws-sep{height:1px;background:var(--border);margin:4px 6px;}
.scope-tag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent2);
  border:1px solid var(--accent3);border-radius:6px;padding:2px 8px;vertical-align:middle;margin-left:8px;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;font-weight:700;color:#fff;}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 14px -4px rgba(59,130,246,0.5);transition:transform .1s,box-shadow .15s,opacity .15s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px -4px rgba(59,130,246,0.7);}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:8px 14px;
  border-radius:8px;font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
.btn-ghost:hover{border-color:var(--border3);color:var(--text);background:var(--glass2);}
.tb-run-badge{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--accent);}
.tb-spinner{display:inline-block;width:8px;height:8px;border:1.5px solid rgba(59,130,246,0.25);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.content{flex:1;overflow-y:auto;padding:26px 32px 44px;}
.content.flush{padding:0;overflow:hidden;}
.siderail{flex-shrink:0;width:64px;display:flex;flex-direction:column;gap:4px;padding:14px 10px;overflow:hidden;
  position:relative;z-index:1000;background:#080C14;border-right:1px solid var(--border);
  transition:width .25s cubic-bezier(.4,0,.2,1);}
.siderail:hover{width:212px;}
.sr-brand{display:flex;align-items:center;gap:10px;height:36px;padding:4px 8px;margin-bottom:12px;cursor:pointer;overflow:hidden;white-space:nowrap;}
.sr-mark{flex-shrink:0;}
.sr-brandtxt{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--white);opacity:0;transition:opacity .18s;letter-spacing:-0.2px;}
.sr-brandtxt span{color:var(--accent);}
.siderail:hover .sr-brandtxt{opacity:1;}
.sr-items{display:flex;flex-direction:column;gap:2px;}
.bn-item{display:flex;align-items:center;gap:0;padding:10px 12px;border-radius:8px;cursor:pointer;
  color:var(--text3);font-family:var(--sans);font-size:13px;font-weight:500;
  transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;
  position:relative;background:transparent;border:none;text-align:left;}
.bn-item svg{flex-shrink:0;}
.bn-label{max-width:0;overflow:hidden;opacity:0;transition:max-width .25s cubic-bezier(.4,0,.2,1),opacity .18s,margin-left .25s;}
.siderail:hover .bn-label{max-width:150px;opacity:1;margin-left:10px;}
.bn-item.on{background:var(--accent2);color:var(--accent);}
.bn-item.on .bn-label{max-width:150px;opacity:1;margin-left:10px;}
.bn-item:not(.on):hover{color:var(--text2);background:rgba(255,255,255,0.05);}
.bn-badge{position:absolute;top:5px;left:22px;min-width:14px;height:14px;border-radius:7px;background:var(--red);
  color:#fff;font-size:8px;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.siderail:hover .bn-badge{top:50%;left:auto;right:12px;transform:translateY(-50%);}
.bn-badge[data-n="0"]{display:none;}
@media(max-width:720px){
  .app{flex-direction:column;}
  .siderail{flex-direction:row;align-items:center;width:auto!important;height:auto;gap:2px;padding:6px 8px;
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    border:1px solid var(--border2);border-radius:100px;
    background:rgba(8,12,20,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.8);}
  .sr-brand{display:none;}
  .sr-items{flex-direction:row;gap:2px;}
  .bn-item{padding:8px 12px;border-radius:100px;}
  .bn-label{max-width:0;opacity:0;margin-left:0;}
  .siderail:hover .bn-label{max-width:0;opacity:0;margin-left:0;}
  .bn-item.on .bn-label{max-width:110px;opacity:1;margin-left:7px;}
  .bn-badge{top:2px;left:auto;right:5px;transform:none;}
  .siderail:hover .bn-badge{top:2px;right:5px;transform:none;}
  .content{padding:20px 16px 110px;}}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-head-label{font-size:11px;letter-spacing:.3px;color:var(--text3);font-weight:600;font-family:var(--sans);text-transform:uppercase;}
.view-title{font-family:var(--sans);font-size:26px;font-weight:800;color:var(--white);letter-spacing:-0.5px;margin-bottom:4px;}
.view-sub{font-family:var(--sans);font-size:13.5px;color:var(--text2);margin-bottom:26px;font-weight:400;}
.section-label{font-size:11px;letter-spacing:.4px;color:var(--text3);font-weight:600;margin-bottom:12px;font-family:var(--sans);text-transform:uppercase;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{padding:20px 22px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);}
.stat-card::after{display:none;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow),var(--sheen);}
.sc-label{font-size:11px;color:var(--text3);letter-spacing:.3px;margin-bottom:12px;font-weight:600;text-transform:uppercase;}
.sc-val{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--white);letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-bottom:4px;line-height:1;}
.sc-val.c{color:var(--red);}.sc-val.g{color:var(--green);}
.sc-sub{font-size:12px;color:var(--text3);}
.table-glass{overflow:hidden;}
.table-head{display:grid;padding:11px 18px;border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.3px;color:var(--text3);text-transform:uppercase;font-weight:600;font-family:var(--sans);}
.table-row{display:grid;padding:13px 18px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .12s;}
.table-row:last-child{border-bottom:none;}
.table-row:hover{background:rgba(255,255,255,0.03);}
.tr-scope{font-family:var(--mono);font-size:12.5px;color:var(--white);display:flex;align-items:center;gap:10px;font-weight:500;}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.st-active .st-dot{background:var(--accent);box-shadow:0 0 7px var(--accent);}
.st-done .st-dot{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,0.6);}
.st-idle .st-dot{background:var(--text3);}
.tr-status{font-size:12px;color:var(--text2);}
.tr-findings{font-family:var(--mono);font-size:12px;color:var(--text2);}
.tr-crit{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:600;}
.tr-crit.none{color:var(--text3);}
.tr-date{font-size:11px;color:var(--text3);font-family:var(--mono);}
.empty-state{padding:56px;text-align:center;color:var(--text3);font-size:13px;line-height:2.2;}
.empty-cta{color:var(--accent);cursor:pointer;font-weight:600;}
.empty-cta:hover{text-decoration:underline;text-underline-offset:3px;}
.sev-tag{font-size:10px;font-weight:600;letter-spacing:.3px;padding:3px 8px;flex-shrink:0;font-family:var(--sans);border-radius:6px;border:1px solid;}
.sev-c{background:var(--sev-cg);color:var(--sev-c);border-color:rgba(239,68,68,0.35);}
.sev-h{background:var(--sev-hg);color:var(--sev-h);border-color:rgba(249,115,22,0.35);}
.sev-m{background:var(--sev-mg);color:var(--sev-m);border-color:rgba(251,191,36,0.35);}
.sev-l{background:var(--sev-lg);color:var(--sev-l);border-color:rgba(96,165,250,0.35);}
.sev-i{background:var(--sev-ig);color:var(--sev-i);border-color:rgba(148,163,184,0.3);}
.warroom2{display:flex;flex-direction:column;height:calc(100vh - 54px - 26px);gap:14px;}
.rail{position:relative;flex-shrink:0;display:flex;gap:8px;padding:4px 2px 2px;}
.rail-track{position:absolute;left:26px;right:26px;top:21px;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;z-index:0;}
.rail-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent),#60A5FA);border-radius:2px;box-shadow:0 0 10px rgba(59,130,246,0.5);transition:width .6s cubic-bezier(.4,0,.2,1);}
.rail-fill.run::after{content:'';position:absolute;right:0;top:-2px;bottom:-2px;width:44px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8));animation:sweep 1.1s ease infinite;}
@keyframes sweep{0%{opacity:0;}50%{opacity:1;}100%{opacity:0;}}
.stop{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 4px 8px;cursor:pointer;border:none;background:transparent;transition:transform .18s;}
.stop:not(:disabled):hover{transform:translateY(-2px);}
.stop:disabled{cursor:not-allowed;}
.stop-node{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:all .25s;
  background:var(--glass2);border:1px solid var(--border2);box-shadow:var(--sheen);}
.stop-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text3);transition:color .2s;}
.stop.done .stop-node{border-color:rgba(16,185,129,0.5);background:rgba(16,185,129,0.12);}
.stop.done .stop-num{color:var(--green);}
.stop.run .stop-node{border-color:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 14%,transparent),0 0 22px color-mix(in srgb,var(--sc) 55%,transparent);animation:nodepulse 1.5s ease infinite;}
.stop.run .stop-num{color:var(--sc);}
.stop.locked{opacity:.4;}
.stop.sel .stop-node{transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,255,255,0.14),var(--sheen);}
@keyframes nodepulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 12%,transparent),0 0 16px color-mix(in srgb,var(--sc) 42%,transparent);}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--sc) 6%,transparent),0 0 28px color-mix(in srgb,var(--sc) 62%,transparent);}}
.stop-name{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.3px;color:var(--text2);transition:color .2s;text-transform:uppercase;}
.stop.sel .stop-name{color:var(--white);}
.stop.locked .stop-name{color:var(--text3);}
.stop-sub{font-family:var(--mono);font-size:9px;color:var(--text3);}
.stop-check{position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:8px;color:#052e16;font-weight:900;border:2px solid var(--bg);}
.ws{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.ws::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--wsc,var(--accent)),transparent);opacity:.7;z-index:3;}
.ws-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
.ws-badge{font-family:var(--sans);font-size:11px;font-weight:600;padding:3px 10px;color:var(--wsc);background:color-mix(in srgb,var(--wsc) 14%,transparent);border:1px solid color-mix(in srgb,var(--wsc) 32%,transparent);border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}
.ws-title{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--white);}
.ws-sub{font-family:var(--sans);font-size:11.5px;color:var(--text3);margin-top:1px;}
.ws-status{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px;}
.ws-body{flex:1;overflow-y:auto;padding:18px;min-height:0;}
.ws-locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text3);text-align:center;}
.ws-locked .ll-t{font-family:var(--sans);font-size:13px;color:var(--text2);letter-spacing:.3px;}
.ws-locked .ll-s{font-family:var(--sans);font-size:12.5px;color:var(--text3);}
.count-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:12px;margin-bottom:18px;}
.count-tile{padding:16px 18px;position:relative;overflow:hidden;}
.count-tile .ct-n{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--white);font-variant-numeric:tabular-nums;line-height:1;}
.count-tile .ct-n.warn{color:var(--amber);}.count-tile .ct-n.crit{color:var(--red);}
.count-tile .ct-l{font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--text3);margin-top:8px;font-weight:600;}
.ghost-layout{display:grid;grid-template-columns:1fr 272px;gap:14px;flex:1;min-height:0;}
.graph-wrap{position:relative;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;min-height:460px;cursor:grab;
  background:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px) -1px -1px/26px 26px,linear-gradient(180deg,#0B1020,#080C14);
  box-shadow:var(--sheen);}
.graph-wrap.panning{cursor:grabbing;}
.graph-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:var(--r-sm);box-shadow:inset 0 0 80px rgba(0,0,0,0.4);}
.graph-stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.graph-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.gedge{fill:none;stroke:rgba(255,255,255,0.15);stroke-width:1.2;opacity:.7;stroke-linecap:round;}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:100px;font-family:var(--mono);font-size:11px;white-space:nowrap;cursor:grab;user-select:none;border:1px solid;transition:filter .12s,box-shadow .12s;z-index:2;touch-action:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.gnode:hover{filter:brightness(1.18);}
.gnode:active{cursor:grabbing;}
.gnode .gdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.gnode.root{background:rgba(59,130,246,0.2);border-color:rgba(59,130,246,0.5);color:#fff;font-weight:700;font-size:12.5px;padding:9px 17px;box-shadow:0 0 0 4px rgba(59,130,246,0.1),0 10px 30px rgba(59,130,246,0.4);}
.gnode.sub{background:rgba(6,182,212,0.12);border-color:rgba(6,182,212,0.4);color:#a7edf8;}
.gnode.url{background:rgba(255,255,255,0.05);border-color:var(--border2);color:var(--text2);}
.gnode.secret{background:rgba(239,68,68,0.14);border-color:rgba(239,68,68,0.45);color:#ffc2cb;}

.flash{animation:flash-pulse .6s ease-out;}

.toast-stack{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:11px 15px;display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:12.5px;color:var(--white);box-shadow:var(--shadow);pointer-events:all;animation:toast-in .2s ease-out;max-width:320px;}
.toast.ok{border-left:3px solid var(--green);}

.toast.info{border-left:3px solid var(--accent);}
.toast.warn{border-left:3px solid var(--amber);}

.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.prog-bar-track{height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;margin:4px 0;}

/* ── target isolation: each program/target is its own workspace ── */
function baseDomain(scope){const p=(scope||'').replace(/^\*\./,'').split('.');return p.length>=2?p.slice(-2).join('.'):(scope||'?');}
function targetKey(s){return (s.program&&s.program.trim())?s.program.trim():baseDomain(s.scope);}
function targetsList(){
  const m={};
  sessions.forEach(s=>{const k=targetKey(s);(m[k]=m[k]||{key:k,sessions:[],findings:0,crit:0});
    m[k].sessions.push(s); m[k].findings+=s.findings.length; m[k].crit+=s.findings.filter(f=>f.sev==='c').length;});
  return Object.values(m).sort((a,b)=>b.findings-a.findings);
}
function activeSessions(){return (!V.target||V.target==='all')?sessions:sessions.filter(s=>targetKey(s)===V.target);}
function allFindingsFlat(){
  const src=activeSessions();
  return src.flatMap((s,si)=>s.findings.map((f,fi)=>({...f,scope:s.scope,program:s.program,huntId:s.id,
    globalIdx:src.slice(0,si).reduce((a,ss)=>a+ss.findings.length,0)+fi})));
}

function mkSess(scope,program=''){
  return{
    id:'s'+Date.now(), scope, program, status:'idle', si:-1,
    stages:Array(8).fill('pending'),
    stageMeta:Array(8).fill(''),
    stageTimes:Array(8).fill(''),
    findings:[], findingsByStage:{},
    logs:Array.from({length:8},()=>[]),

}

  sess0.forEach(s=>{ const cov=coverageFor(s); if(s.status==='completed'&&cov.dpct<100){ A.push({sev:'l', ico:'vault', t:`Deepen ${cov.total-cov.deep} shallow cell${(cov.total-cov.deep)>1?'s':''} on ${s.scope}`, sub:`breadth ${cov.pct}% · depth ${cov.dpct}% — real bugs hide in the untested depth`, cta:'▸', onclick:"nav('coverage')"}); }
    else if(s.status==='active'){ A.push({sev:'h', ico:'play', t:`Resume hunt · ${s.scope}`, sub:`stage ${s.si+1}/8 running`, cta:'▸', onclick:`openHunt('${s.id}')`}); } });
  sess0.forEach(s=>{ (s.identities||[]).forEach(idn=>{ if(idn.exp&&idn.exp-Date.now()<25*60000){ A.push({sev:'m', ico:'swap', t:`${idn.name} token expiring on ${s.scope}`, sub:`${Math.max(0,Math.round((idn.exp-Date.now())/60000))}m left — refresh to keep the differential oracles running`, cta:'↻', onclick:`openHunt('${s.id}')`}); } }); });
  sess0.forEach(s=>{ const near=chainsFor(s).find(c=>c.sev!=='x'&&c.steps.some(st=>st.st==='partial')); if(near){ const e=near.steps.find(st=>st.st!=='done'); A.push({sev:'h', ico:'route', t:`Chain 1 edge from ${({c:'CRITICAL',h:'HIGH',m:'MEDIUM'})[near.sev]||''} impact`, sub:`${near.name} — prove: ${e?e.t:''}`, cta:'▸', onclick:"nav('chains')"}); } });
  // dedup by title (same near-miss across targets), then priority sort (crit→low)
  const seen={}, uniq=A.filter(a=>seen[a.t]?false:(seen[a.t]=1));
  const rank={c:0,h:1,m:2,l:3,i:4};
  uniq.sort((a,b)=>(rank[a.sev]??9)-(rank[b.sev]??9));
  return uniq;
}

function agentState(sess,ai){const s=sess.stages[ai];return s==='done'?'done':s==='active'?'running':'locked';}

function renderTerminal(el, sess){
  if(!sess){el.innerHTML='<div style="padding:32px;color:var(--text3)">Hunt not found.</div>';return;}
  const cur = sess.status==='completed'?7:(sess.si<0?0:sess.si);
  V.agent=cur; // keep the live log append targeting the current stage
  const askHTML = sess._pendingAsk ? askBar(sess, sess._pendingAsk) : '';
  const idHTML = (sess.identities&&sess.identities.length) ? identitiesStrip(sess) : '';
  let body;
  if(sess.status==='completed'){
    body = V.recon ? (`<div class="res-back"><button class="btn-ghost" onclick="hideRecon()">← Results</button></div>`+wsGHOST(sess)) : resultsSummary(sess);
  } else {
    body = termHTML(sess, cur, false); // single live terminal — no 8-tab switching
  }
  el.innerHTML=`<div class="warroom2">${railHTML(sess)}${idHTML}${askHTML}${body}</div>`;
  if(sess.status==='completed'){
    if(V.recon) requestAnimationFrame(()=>mountGraph(sess));
  } else {
    const bd=document.getElementById('wrt-body');
    if(bd){ bd.innerHTML=''; (sess.logs[cur]||[]).forEach(l=>appendWrtLine(l,AGENTS[cur].accent,false)); (sess.findingsByStage[cur]||[]).forEach(f=>appendWrtFinding(f)); bd.scrollTop=bd.scrollHeight; }
  }
  if(sess._pendingAsk){ const inp=document.getElementById('ask-input'); if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')deliverAsk();}); } }
}

function identitiesStrip(sess){

  return `<div class="idstrip">

function railHTML(sess){

function workspaceHTML(sess,ai,st){
  if(st==='locked') return lockedHTML(ai);
  if(st==='running') return termHTML(sess,ai,false);
  // done
  if(ai===0) return wsATLAS(sess);
  if(ai===1) return wsGHOST(sess);
  if(ai===2) return wsCIPHER(sess);
  if(ai===3) return wsVECTOR(sess);
  if(ai===4) return termHTML(sess,ai,true);
  if(ai===5) return wsFORGE(sess);
  if(ai===6) return wsJUDGE(sess);

function cvssFg(c){c=parseFloat(c);return c>=9?'var(--sev-c)':c>=7?'var(--sev-h)':'var(--sev-m)';}

function agentData(sess){
  const host=sess.scope||'target.com';
  const parts=host.split('.');

  const subs=[

    {h:'admin.'+base,code:200,tech:'Express · React',flag:''},

    {h:'cdn.'+base,code:403,tech:'CloudFront',flag:''},
  ];
  const secrets=[
    {loc:'main.chunk.js:2841',type:'JWT Bearer token',val:'eyJhbGciOiJSUzI1NiJ9.eyJzdW… (RS256 · 30d exp)'},
    {loc:'config.js:58',type:'DB password',val:'prod_db_admin•••••••'},
    {loc:'utils.js:192',type:'Internal admin path',val:'/internal/admin/debug'},
  ];
  const cves=[
    {id:'CVE-2024-21538',comp:'cross-spawn 7.0.3',cvss:'7.5',note:'ReDoS via crafted argument'},
    {id:'CVE-2023-45857',comp:'axios 1.5.0',cvss:'6.5',note:'SSRF / credential leak via proxy'},
    {id:'CVE-2024-4068',comp:'braces 3.0.2',cvss:'5.3',note:'Resource exhaustion (recursion)'},
  ];
  const reports=[
    {title:'IDOR on orders endpoint',bounty:'$3,500',sim:'92%'},
    {title:'SQLi in search parameter',bounty:'$8,000',sim:'88%'},
    {title:'CORS null origin → token theft',bounty:'$1,200',sim:'74%'},
  ];
  const surface=[
    {ep:'/api/v1/users/search',param:'q',cls:'SQL Injection',prio:98},
    {ep:'/api/v1/orders/{id}',param:'id',cls:'IDOR / BOLA',prio:86},
    {ep:'/api/data',param:'Origin',cls:'CORS misconfig',prio:64},
    {ep:'/api/v1/upload',param:'file',cls:'File upload → RCE',prio:57},
    {ep:'/api/v2/fetch',param:'url',cls:'SSRF / Open redirect',prio:49},
  ];
  const stack=['nginx 1.25','Node.js 18','Express','React 18','PostgreSQL','Cloudflare','AWS S3'];

let GRAPH=null;
function mountGraph(sess){
  const wrap=document.getElementById('ghost-graph'); if(!wrap) return;
  const stage=document.getElementById('ghost-stage');
  const svg=document.getElementById('ghost-edges');
  const panel=document.getElementById('ghost-panel');
  const d=agentData(sess);
  const W=Math.max(wrap.clientWidth,760), H=Math.max(wrap.clientHeight,460);
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2-95;
  const nodes=[{id:'root',label:d.base,type:'root',x:cx,y:cy,info:{Type:'Root domain',Subdomains:d.subs.length,URLs:d.urlCount}}];
  const edges=[];
  d.subs.forEach((s,k)=>{
    const a=(k/d.subs.length)*Math.PI*2 - Math.PI/2;
    nodes.push({id:'s'+k,label:s.h.split('.')[0]+'.',type:'sub',warn:!!s.flag,x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,info:{Host:s.h,Status:s.code,Tech:s.tech,Note:s.flag||'—'}});
    edges.push(['root','s'+k]);
  });
  const s0=nodes.find(n=>n.id==='s0');
  [{label:'/api/v1',type:'url',info:{URL:'/api/v1',Status:200}},
   {label:'/api/v2',type:'url',info:{URL:'/api/v2',Status:200}},
   {label:'/.git/config',type:'secret',info:{URL:'/.git/config',Status:200,Risk:'Repository exposed'}}
  ].forEach((lf,k)=>{
    const a=(-Math.PI/2)+(k-1)*0.55;
    nodes.push({...lf,id:'l'+k,x:s0.x+Math.cos(a)*135,y:s0.y+Math.sin(a)*100});
    edges.push(['s0','l'+k]);
  });
  const NS='http://www.w3.org/2000/svg';
  stage.querySelectorAll('.gnode').forEach(n=>n.remove());
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.style.width=W+'px'; svg.style.height=H+'px';
  svg.innerHTML=`<defs><linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9D6FFF" stop-opacity="0.55"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/></linearGradient></defs>`;
  const pathEls={};
  edges.forEach(([a,b])=>{const p=document.createElementNS(NS,'path');p.setAttribute('class','gedge');svg.appendChild(p);pathEls[a+'>'+b]=p;});
  nodes.forEach(n=>{
    const el=document.createElement('div');
    el.className='gnode '+n.type+(n.warn?' warn':'');
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    const dotCol=n.warn?'var(--amber)':n.type==='root'?'#C4B5FD':'#22D3EE';
    el.innerHTML=(n.type==='sub'||n.type==='root'?`<span class="gdot" style="background:${dotCol}"></span>`:'')+n.label;
    stage.appendChild(el); n.el=el;
  });
  function drawEdges(){edges.forEach(([a,b])=>{
    const na=nodes.find(x=>x.id===a),nb=nodes.find(x=>x.id===b),p=pathEls[a+'>'+b];
    const mx=(na.x+nb.x)/2,my=(na.y+nb.y)/2,dx=nb.x-na.x,dy=nb.y-na.y;
    const len=Math.hypot(dx,dy)||1,off=Math.min(38,len*0.12);
    const qx=mx+(-dy/len)*off,qy=my+(dx/len)*off;
    p.setAttribute('d',`M${na.x} ${na.y} Q${qx} ${qy} ${nb.x} ${nb.y}`);
  });}
  drawEdges();

  let tx=0,ty=0,scale=1;
  function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
  function fit(){
    const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const minX=Math.min(...xs)-80,maxX=Math.max(...xs)+80,minY=Math.min(...ys)-45,maxY=Math.max(...ys)+45;
    const bw=maxX-minX,bh=maxY-minY,vw=wrap.clientWidth,vh=wrap.clientHeight;
    scale=Math.min(vw/bw,vh/bh,1.35);
    tx=(vw-bw*scale)/2-minX*scale; ty=(vh-bh*scale)/2-minY*scale; apply();
  }
  function zoomAt(f,px,py){
    const ns=Math.min(2.6,Math.max(0.35,scale*f));
    const lx=(px-tx)/scale,ly=(py-ty)/scale;
    scale=ns; tx=px-lx*scale; ty=py-ly*scale; apply();
  }
  GRAPH={wrap,zoomAt,fit};
  fit();

  wrap.onwheel=e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);};
  let pan=null;
  function panMove(e){if(!pan)return;tx=pan.tx+(e.clientX-pan.x);ty=pan.ty+(e.clientY-pan.y);apply();}
  function panUp(){pan=null;wrap.classList.remove('panning');window.removeEventListener('pointermove',panMove);window.removeEventListener('pointerup',panUp);}
  wrap.onpointerdown=e=>{if(e.target.closest('.gnode'))return;e.preventDefault();pan={x:e.clientX,y:e.clientY,tx,ty};wrap.classList.add('panning');window.addEventListener('pointermove',panMove);window.addEventListener('pointerup',panUp);};

  nodes.forEach(n=>{
    n.el.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      const start={x:e.clientX,y:e.clientY,nx:n.x,ny:n.y};let moved=false;
      const mv=ev=>{const dx=(ev.clientX-start.x)/scale,dy=(ev.clientY-start.y)/scale;if(Math.abs(ev.clientX-start.x)+Math.abs(ev.clientY-start.y)>3)moved=true;n.x=start.nx+dx;n.y=start.ny+dy;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';drawEdges();};
      const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(!moved)selectNode(n);};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
    });
  });
  function selectNode(n){stage.querySelectorAll('.gnode.sel').forEach(x=>x.classList.remove('sel'));n.el.classList.add('sel');panel.innerHTML=`<div class="gp-h">Node detail</div><div class="gp-node-title">${n.label.replace(/\.$/,'')}</div>${Object.entries(n.info||{}).map(([k,v])=>`<div class="gp-kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}`;}
  panel.innerHTML=`<div class="gp-h">JS secrets found (${d.secrets.length})</div>${d.secrets.map(s=>`<div class="secret-item"><div class="si-loc">${s.loc}</div><div class="si-type">${s.type}</div><div class="si-val">${s.val}</div></div>`).join('')}<div class="gp-h" style="margin-top:16px">Tip</div><div style="font-size:11px;color:var(--text3);line-height:1.6">Drag a node to reposition · click it for detail · scroll to zoom.</div>`;
}
function graphZoom(f){if(GRAPH)GRAPH.zoomAt(f,GRAPH.wrap.clientWidth/2,GRAPH.wrap.clientHeight/2);}
function graphFit(){if(GRAPH)GRAPH.fit();}

function typewrite(span, text, accent){
  const cursor=document.createElement('span');cursor.className='cursor';
  span.appendChild(cursor);
  let i=0;
  const tick=()=>{
    if(i>=text.length){cursor.remove();return;}
    span.insertBefore(document.createTextNode(text[i]),cursor);
    i++;
    setTimeout(tick, 8+Math.random()*16);
  };
  tick();
}

function pocLines(pf){
  const reqL=(pf.req||'').split('\n').map(l=>`<div class="pl req"><span class="pl-p">›</span><span>${l||' '}</span></div>`).join('');
  const resL=(pf.resp||'').split('\n').map(l=>{const cls=/HTTP\/.*(200|201)/.test(l)?'ok':/HTTP\/.*(4|5)\d\d/.test(l)?'warn':'res';return `<div class="pl ${cls}"><span class="pl-p">‹</span><span>${l||' '}</span></div>`;}).join('');
  return `<div class="poc-sec-l">request sent</div>${reqL}<div class="poc-sec-l" style="margin-top:8px">response received</div>${resL}`;
}
function pocShots(f){
  if(f.sev==='c') return [{code:"500 · SQL syntax error",cap:"injected ' OR 1=1-- → MySQL error leaks"},{code:"UNION · 5 rows",cap:"dumped id · email · password_hash"}];
  if(f.sev==='h') return [{code:"200 · order 1337",cap:"victim PII returned to attacker token"},{code:"no rate-limit",cap:"enumerated ids 1000–9999"}];
  return [{code:"ACAO: null",cap:"null origin reflected with credentials"},{code:"token exfil",cap:"session token read cross-origin"}];
}
function playPoc(b64,btn){
  let pf; try{pf=JSON.parse(decodeURIComponent(atob(b64)));}catch(e){return;}
  const term=document.getElementById('poc-term'); if(!term)return;
  if(btn){btn.disabled=true;}
  const reqL=(pf.req||'').split('\n'), resL=(pf.resp||'').split('\n');
  term.innerHTML='<div class="poc-sec-l">request sent</div>';
  let i=0; const cur=()=>{const c=document.createElement('span');c.className='poc-cur';return c;};
  const typeReq=()=>{
    if(i>=reqL.length){ setTimeout(showResp,350); return; }
    const d=document.createElement('div'); d.className='pl req'; d.innerHTML=`<span class="pl-p">›</span><span></span>`;
    term.appendChild(d); const span=d.querySelector('span:last-child'); const txt=reqL[i]; let j=0; span.appendChild(cur());
    const t=()=>{ if(j<txt.length){ span.insertBefore(document.createTextNode(txt[j]),span.lastChild); j++; setTimeout(t,6+Math.random()*14);} else { span.lastChild.remove(); i++; setTimeout(typeReq,40);} };
    t(); term.scrollTop=term.scrollHeight;
  };
  let k=0;
  const showResp=()=>{
    if(k===0){ const s=document.createElement('div'); s.className='poc-sec-l'; s.style.marginTop='8px'; s.textContent='response received'; term.appendChild(s); }
    if(k>=resL.length){ if(btn){btn.disabled=false;} return; }
    const l=resL[k]; const cls=/HTTP\/.*(200|201)/.test(l)?'ok':/HTTP\/.*(4|5)\d\d/.test(l)?'warn':'res';
    const d=document.createElement('div'); d.className='pl '+cls; d.innerHTML=`<span class="pl-p">‹</span><span>${l||' '}</span>`; term.appendChild(d); term.scrollTop=term.scrollHeight; k++; setTimeout(showResp,90);
  };
  typeReq();
}
function submissionReadiness(sess,f){
  const cors=/cors/i.test((f.title||'')+(f.endpoint||''));
  const low=f.sev==='l'||f.sev==='i';
  const checks=[
    {label:'Impact demonstrated', state:'pass', note:'PoC + captured request/response, reproduced 2×'},
    {label:'Target in program scope', state:'pass', note:sess.scope||'in scope'},
    cors?{label:'Qualifying class', state:'warn', note:'CORS reads Low/N-A without a real-impact chain — attach the token/session-theft chain'}
        :{label:'Qualifying class', state:'pass', note:f.sev==='c'?'SQLi — top-paying qualifying type':'qualifying vulnerability type'},
    {label:'Duplicate check', state:'pass', note:'no match across disclosed reports + your submissions'},
    {label:'CVSS / severity justified', state:'pass', note:'CVSS '+f.cvss},
    {label:'Report complete (steps + remediation)', state:'pass', note:'all sections present'}
  ];
  const warns=checks.filter(c=>c.state==='warn').length, fails=checks.filter(c=>c.state==='fail').length;
  const verdict = fails?'hold':warns?'review':'ready';
  let acc = f.sev==='c'?92:f.sev==='h'?85:f.sev==='m'?66:45; acc-=warns*22+fails*40; acc=Math.max(5,acc);
  return {verdict, checks, acceptPct:acc, dupPct:6, naPct: cors?28:(low?22:7), est:estBounty(f)};
}
function submitTo(platform, verdict){

  el.innerHTML='<span style="color:var(--text2)">formatting for '+platform+' · mapping CVSS→VRT · attaching evidence…</span>';
  setTimeout(()=>{ const id=platform.replace(/[^A-Z]/g,'').slice(0,2)+'-'+Math.floor(100000+Math.random()*900000);
    el.innerHTML='<span style="color:var(--green)">✓ submitted to '+platform+' · report '+id+'</span>'; }, 1300);
}

**Target:** ${sess.scope||'N/A'}
**Severity:** ${f.label} · CVSS ${f.cvss}

## Summary
${f.detail}.

${f.steps||'1. ...'}

## Proof of Concept
\`\`\`bash
$ curl -s 'https://${sess.scope||'TARGET'}${f.endpoint||'/api/endpoint'}' \\
  -H 'Authorization: Bearer $ATTACKER_TOKEN'
\`\`\`

## Impact
${f.sev==='c'?'Full database compromise. PII, credentials, and sensitive data exposed to unauthenticated attackers.':f.sev==='h'?'Cross-user data access. Authenticated attacker can read any user\'s private resources.':'Session hijacking possible via CORS bypass with credentialed requests.'}

## Remediation

function renderChains(el){
  const sess=getS()||sessions[0];
  if(!sess){el.innerHTML=`<div class="view-title">Chains</div><div class="view-sub">Run a hunt to build attack chains.</div>`;return;}
  const chains=chainsFor(sess);
  const sevName={c:'CRITICAL',h:'HIGH',m:'MEDIUM',x:'DEAD END'};
  const live=chains.filter(c=>c.sev!=='x');
  const done=live.filter(c=>c.steps.every(s=>s.st==='done')).length;
  el.innerHTML=`
    <div class="view-title">Attack chains</div>
    <div class="view-sub">The multi-step paths single-cell testing misses. Each step is tracked — including dead ends — so a lead is never silently dropped.</div>
    <div class="count-strip" style="max-width:640px">
      <div class="count-tile"><div class="ct-n">${live.length}</div><div class="ct-l">Active chains</div></div>
      <div class="count-tile"><div class="ct-n" style="color:var(--green)">${done}</div><div class="ct-l">Fully proven</div></div>
      <div class="count-tile"><div class="ct-n crit">${chains.filter(c=>c.sev==='c').length}</div><div class="ct-l">Critical paths</div></div>
      <div class="count-tile"><div class="ct-n">${chains.filter(c=>c.sev==='x').length}</div><div class="ct-l">Dead ends logged</div></div>
    </div>
    ${(()=>{
      const nd=chains.filter(c=>c.sev!=='x');
      const near=nd.filter(c=>{const rem=c.steps.filter(s=>s.st!=='done');return rem.length>=1 && !c.steps.some(s=>s.st==='blocked');});
      const rank={c:0,h:1,m:2};
      const best=near.slice().sort((a,b)=>rank[a.sev]-rank[b.sev])[0];
      const edge=best?best.steps.find(s=>s.st!=='done'):null;
      const sevName={c:'CRITICAL',h:'HIGH',m:'MEDIUM'};
      return `<div class="reach">
        <div class="reach-h">Capability reachability — chains found by graph search, not guesswork</div>
        <div class="reach-body">
          <div><b>${done}</b> proven path${done!==1?'s':''} to impact · <b>${near.length}</b> one edge away</div>
          ${edge?`<div class="reach-next">➜ Highest-leverage next step: <b>${edge.t}</b> → unlocks <span style="color:var(--sev-${best.sev})">${sevName[best.sev]}</span> ${best.name}</div>`:''}
        </div>
      </div>`;
    })()}
    ${chains.map(ch=>{
      const proven=ch.steps.filter(s=>s.st==='done').length;
      return `<div class="chain ${ch.sev==='x'?'dead':''}">
        <div class="chain-head">
          <span class="chain-sev sv-${ch.sev}">${sevName[ch.sev]}</span>
          <span class="chain-name">${ch.name}</span>
          <span class="chain-tier">${ch.tier}</span>
          <span class="chain-prog">${proven}/${ch.steps.length} steps</span>
        </div>
        <div class="chain-flow">
          ${ch.steps.map((s,i)=>`
            ${i>0?`<span class="chain-arr ${s.st==='blocked'?'x':''}">→</span>`:''}
            <div class="chain-step ${s.st}${s.fi!=null&&s.fi>=0?' link':''}" ${s.fi!=null&&s.fi>=0?`onclick="nav('report-view',{huntId:'${sess.id}',sev:'${sess.findings[s.fi].sev}',fi:${s.fi}})"`:''} title="${s.note||s.st}">
              <span class="cs-ico">${s.st==='done'?'✓':s.st==='blocked'?'✕':'●'}</span>
              <span class="cs-t">${s.t}</span>
              ${s.note?`<span class="cs-note">${s.note}</span>`:''}
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}`;
}

   COVERAGE LEDGER
══════════════════════════════════════════════ */
function coverageFor(sess){
  const d=agentData(sess), base=d.base;
  const classes=['IDOR','AuthZ','Injection','SSRF','XSS','Logic','Auth'];
  const raw=[
    {label:'/api/v1/users/search', type:'endpoint',  ap:['AuthZ','Injection','Logic']},
    {label:'/api/v1/orders/{id}',  type:'endpoint',  ap:['IDOR','AuthZ','Logic']},
    {label:'/api/data',            type:'endpoint',  ap:['AuthZ','SSRF']},
    {label:'/api/v1/upload',       type:'endpoint',  ap:['Injection','XSS','Logic']},
    {label:'/api/v2/fetch',        type:'endpoint',  ap:['SSRF','XSS','Logic']},
    {label:'admin.'+base+'/login', type:'auth flow', ap:['Auth','AuthZ','Logic']},
    {label:'/api/v1/profile',      type:'endpoint',  ap:['IDOR','AuthZ','XSS']},
    {label:'/oauth/callback',      type:'auth flow', ap:['Auth','Logic']},
    {label:'api.'+base,            type:'host',      ap:['SSRF','Injection']},
    {label:'dev.'+base,            type:'host',      ap:['AuthZ','Logic']},
  ];
  const findMap={};
  sess.findings.forEach((f,i)=>{
    const s=((f.endpoint||'')+' '+(f.title||'')).toLowerCase();
    if(s.includes('users/search')||s.includes('sql')) findMap['/api/v1/users/search|Injection']=i;
    else if(s.includes('orders')||s.includes('idor')) findMap['/api/v1/orders/{id}|IDOR']=i;
    else if(s.includes('/api/data')||s.includes('cors')) findMap['/api/data|AuthZ']=i;
  });
  const frac = sess.status==='completed' ? 1 : Math.max(0,sess.si)/8;
  let total=0,resolved=0,findings=0,deep=0,shallow=0,tc=0; const items=[];
  raw.forEach((it,idx)=>{
    const cells={};
    it.ap.forEach(cls=>{
      total++;
      const key=it.label+'|'+cls;
      let st,tier=0;
      if(findMap[key]!=null){st='finding';findings++;resolved++;tier=3;deep++;}
      else if((idx/raw.length)<frac){
        st='tested';resolved++;tc++;
        tier=(tc%6===0)?1:2;            // a few cells only reached a shallow single probe
        if(tier>=2)deep++; else shallow++;
      } else st='todo';
      cells[cls]={st,fi:findMap[key],tier};
    });
    items.push({...it,cells});
  });
  const verified=resolved; // every tested/finding cell is bound to a captured request/response
  return {classes,items,total,resolved,verified,findings,deep,shallow,untested:total-resolved,
    pct:total?Math.round(resolved/total*100):0,vpct:total?Math.round(verified/total*100):0,
    dpct:total?Math.round(deep/total*100):0};
}

          <div class="cov-stat"><b style="color:var(--red)">${cov.findings}</b><span>findings · <span class="bc-link" onclick="nav('chains')" style="color:var(--accent)">${chainsFor(sess).filter(c=>c.sev!=='x').length} chains</span></span></div>

          <div class="cov-verdict ${fullDepth&&cov.vpct===100?'ok':'no'}">${fullDepth&&cov.vpct===100?'✓ Exhausted — 0 left, 100% verified & at depth':exhausted?'● deepen '+cov.shallow+' shallow (T1) cells before calling it done':'● '+cov.untested+' cells remaining'}</div>

  sessions.slice(0,6).forEach(s=>base.push({t:'Open hunt · '+s.scope, s:s.findings.length+' findings · '+(s.status==='active'?'running':'completed'), ic:'host', run:()=>openHunt(s.id)}));

  base.push({t:'Surface workbench', s:'target tree · repeater · diff', ic:'header', run:()=>nav('workbench')});
  base.push({t:'Programs', s:'engagements · payouts · earnings', ic:'vault', run:()=>nav('programs')});
  base.push({t:'All findings', s:'every finding across hunts', ic:'send', run:()=>nav('findings')});
  const ql=q.toLowerCase().trim();
  // deep search: endpoints + findings across the active workspace
  const deep=[];
  if(ql&&ql.length>=2){
    activeSessions().forEach(s=>{
      s.findings.forEach(f=>{ if(((f.title||'')+(f.endpoint||'')).toLowerCase().includes(ql))
        deep.push({t:f.title, s:'finding · '+(f.endpoint||s.scope), ic:'send', run:()=>nav('report-view',{huntId:s.id,sev:f.sev,fi:s.findings.indexOf(f)})}); });
      try{ coverageFor(s).items.forEach(it=>{ if(it.label.toLowerCase().includes(ql))
        deep.push({t:it.label, s:'endpoint · '+s.scope, ic:'route', run:()=>{V.target=targetKey(s);selectEp(s.id,it.label);closePalette();nav('workbench');}}); }); }catch(e){}

  }
  const out=[];
  if(ql){ out.push({t:'Hunt '+q, s:'run the full pipeline on this target', ic:'bolt', primary:true, run:()=>ckHunt(q)}); }

/* platform-aware shortcut label: ⌘ on Mac, Ctrl everywhere else (Linux/Windows) */
const MOD = /Mac|iPhone|iP(ad|od)/i.test((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||navigator.userAgent) ? '⌘' : 'Ctrl';
const PLATFORM_NOISE = ['hackerone.com','wearehackerone.com','bugcrowd.com','intigriti.com','yeswehack.com','example.com','github.com','google.com'];

/* extract target + scope from a pasted program page (mirrors the engine's hunt-intake) */
function parseProgram(){
  const info=document.getElementById('mi-parsed');
  const tgt=document.getElementById('mi-target');
  const t=(document.getElementById('mi-paste').value||'');
  if(!t.trim()){ info.innerHTML="We'll pull the target &amp; scope from this — or fill the target field below."; window._pasteScope=null; return; }
  let mode='in'; const allow=new Set(), deny=new Set();
  for(const raw of t.split('\n')){
    const l=raw.trim(); if(!l) continue; const low=l.toLowerCase();
    if(/(out[\s-]?of[\s-]?scope|not in scope|excluded|exclusions|ineligible)/.test(low) && l.length<60){ mode='out'; continue; }
    if(/(in[\s-]?scope|^scope\b|targets?|assets?|domains?|eligible)/.test(low) && l.length<60){ mode='in'; continue; }
    const wild=l.match(/\*\.(?:[a-z0-9-]+\.)+[a-z]{2,}/ig)||[];
    const hosts=(l.match(/\b(?:[a-z0-9][a-z0-9-]*\.)+[a-z]{2,}\b/ig)||[])
                 .filter(h=>!/\.(js|json|css|html|htm|png|jpg|svg|md|txt|map|ts|php|xml|yml|yaml)$/i.test(h));
    [...wild,...hosts].forEach(h=>{ h=h.toLowerCase(); if(PLATFORM_NOISE.includes(h.replace(/^\*\./,''))) return; (mode==='out'?deny:allow).add(h); });
  }
  const a=[...allow].filter(h=>!deny.has(h));
  const rew=(t.match(/(critical|high|medium|low)[^\n$€£]{0,30}?[$€£]\s?[\d,]+(?:\s?[-–]\s?[$€£]?\s?[\d,]+)?/ig)||[]).slice(0,3);
  const pick=a.find(h=>h.startsWith('api.'))||a.find(h=>!h.startsWith('*.'))||a[0]||'';
  if(pick && tgt.dataset.edited!=='1') tgt.value=pick.replace(/^\*\./,'');
  info.innerHTML = a.length
    ? `<span style="color:var(--green)">✓ ${a.length} in-scope host${a.length>1?'s':''}</span>`
      + (deny.size?` · ${deny.size} out-of-scope`:'')
      + (rew.length?` · rewards: ${rew[0].replace(/\s+/g,' ')}`:'')
      + ` · target → <b style="color:var(--white)">${tgt.value||'?'}</b>`
    : `<span style="color:var(--amber)">No scope section spotted — type the target below.</span>`;
  window._pasteScope={allow:a, deny:[...deny], rewards:rew, text:t};
}

function startHunt(){
  const tEl=document.getElementById('mi-target');
  if(document.getElementById('mi-paste').value.trim() && !tEl.value.trim()) parseProgram();
  const scope=tEl.value.trim().replace(/^https?:\/\//,'');
  if(!scope){ const info=document.getElementById('mi-parsed'); if(info) info.innerHTML='<span style="color:var(--red)">Paste a program page or type a target first.</span>'; tEl.focus(); return; }
  const program=document.getElementById('mi-program').value.trim();
  const sess=mkSess(scope,program);
  if(window._pasteScope){ sess.scopeText=window._pasteScope.text; sess.scopeAllow=window._pasteScope.allow; sess.scopeDeny=window._pasteScope.deny; sess.rewards=window._pasteScope.rewards; }
  sessions.unshift(sess);

/* ══════════════════════════════════════════════

══════════════════════════════════════════════ */
function pipelineTick(id){
  const sess=sessions.find(s=>s.id===id); if(!sess) return;
  if(V.page==='hunt-terminal'&&V.huntId===id){
    if(V.follow) V.agent=sess.status==='completed'?7:(sess.si<0?0:sess.si);
    renderTerminal(document.getElementById('content'),sess);
  } else if(V.page==='coverage'){
    renderCoverage(document.getElementById('content'));
  }
}

/* interactive human-in-the-loop ASKs (hunt-interactive): engine asks, operator delivers */
const ASKS_AT={
  1:{id:'recon-session',kind:'session',
     need:'an authenticated session for the target',
     why:'the API rejects self-minted tokens on this host — only a live browser session authenticates, so I need yours to hunt the authenticated surface',
     how:'DevTools ▸ Network ▸ any /api request ▸ copy the "Authorization: Bearer …" value (or the session cookie)',
     ph:'Authorization: Bearer eyJ… (or cookie)'},
  4:{id:'exploit-lowpriv',kind:'identity',
     need:'a SECOND, low-privilege account token',
     why:'the admin account sees everything by design; the access-control / IDOR bug only shows as a differential — I need a restricted identity to compare against',
     how:'create (or let me create) a restricted account, log in as it in an incognito tab, paste its Bearer',
     ph:'low-priv account Bearer token'}
};
function runPipeline(id){ stepInto(id,0); }
function stepInto(id,i){
  const sess=sessions.find(s=>s.id===id); if(!sess) return;
  if(i>0){ const prev=i-1; sess.stages[prev]='done'; sess.stageTimes[prev]=((Date.now()-sess._stageStart)/1000).toFixed(1); sess.stageMeta[prev]=STAGE_META[prev]; }
  if(i===8){ sess.status='completed'; sess.elapsed=((Date.now()-sess._start)/1000).toFixed(1); updateBadges(); pipelineTick(id); return; }
  sess.stages[i]='active'; sess.si=i; sess.status='active'; sess._stageStart=Date.now(); updateBadges();
  const ask=ASKS_AT[i];
  if(ask && !(sess._delivered&&sess._delivered[ask.id])){
    sess._pendingAsk={...ask,stage:i}; pipelineTick(id); return;   // PAUSE — wait for the operator
  }
  runStageBody(id,i);
}
function runStageBody(id,i){
  const sess=sessions.find(s=>s.id===id); if(!sess) return;
  pipelineTick(id); startRailTimer(i,id);
  const lines=SCRIPTS[i].map(l=>({...l,v:l.v.replace(/%s/g,sess.scope)}));
  let delay=0;
  lines.forEach((l,j)=>{ delay += j===0?300 : l.t==='cmd'?200+Math.random()*150 : 80+Math.random()*120;
    setTimeout(()=>{ const s=sessions.find(s=>s.id===id);if(!s)return; s.logs[i].push(l);
      if(V.page==='hunt-terminal'&&V.huntId===id&&V.agent===i) appendWrtLine(l, AGENTS[i].accent, true); },delay); });
  const fi=FINDINGS_AT[i];
  if(fi)fi.forEach((f,fi2)=>setTimeout(()=>{ const s=sessions.find(s=>s.id===id);if(!s)return; s.findings.push(f);
    if(!s.findingsByStage[i])s.findingsByStage[i]=[]; s.findingsByStage[i].push(f); updateBadges();
    if(V.page==='hunt-terminal'&&V.huntId===id&&V.agent===i) appendWrtFinding(f); }, delay+fi2*600+400));
  setTimeout(()=>stepInto(id,i+1), delay+900);
}
function deliverAsk(){
  const sess=getS(); if(!sess||!sess._pendingAsk) return;
  const el=document.getElementById('ask-input'); const val=(el&&el.value.trim())||'';
  if(!val) { if(el){el.style.borderColor='var(--red)'; el.focus();} return; }
  const ask=sess._pendingAsk;
  sess._delivered=sess._delivered||{}; sess._delivered[ask.id]=true;
  sess.identities=sess.identities||[];
  const nm = ask.kind==='session'?'session':'low-priv';
  const mask = val.length>16 ? val.slice(0,12)+'…'+val.slice(-4) : val.replace(/./g,'•');
  const existing = sess.identities.find(x=>x.name===nm);
  const rec = {name:nm, kind:ask.kind, mask, exp: Date.now()+30*60000, at:ask.stage};
  if(existing) Object.assign(existing, rec); else sess.identities.push(rec);
  sess.logs[ask.stage].push({t:'ok',v:'✓ '+nm+' identity delivered by operator · verified via control request → 200 authenticated'});
  sess._pendingAsk=null;
  runStageBody(sess.id, ask.stage);
}
function refreshIdentity(name){
  const sess=getS(); if(!sess) return;
  const kind = name==='session'?'session':'identity';
  const base = ASKS_AT[name==='session'?1:4];
  sess._pendingAsk={...base, id:'refresh-'+name, kind, stage: sess.status==='completed'?7:(sess.si<0?0:sess.si),
    need:'a fresh '+name+' token (the previous one expired)', why:'the '+name+' session expired mid-hunt — deliver a new one and I resume exactly where I paused, no re-run'};
  renderTerminal(document.getElementById('content'), sess);
}

function startRailTimer(i, id){
  const t0=Date.now();
  const tid=setInterval(()=>{
    const sess=sessions.find(s=>s.id===id);
    const el=document.getElementById('rail-timer');
    if(!sess||sess.stages[i]!=='active'||V.agent!==i||!el){clearInterval(tid);return;}
    el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
  },100);
}

const SMELL_RULES=[[/\.(bak|old|zip|sql)|\/\.git|\/\.env|\.map\b/i,6,'source/backup exposed'],
  [/sk_|api[_-]?key|secret|password/i,7,'possible secret'],[/\/admin|\/internal|\/manage|\/console/i,4,'privileged path'],
  [/\/debug|\/actuator|\/test|\/staging/i,4,'debug surface'],[/\/v0\/|\/v1\/|\/legacy|\/old/i,3,'legacy version'],
  [/[?&](url|redirect|next|callback|fetch|proxy)=/i,4,'SSRF/redirect param'],[/graphql|swagger|api-docs/i,3,'introspectable'],
  [/\{id\}|[?&](id|user_?id|order_?id)=|\/\d+/i,3,'id-bearing (IDOR)'],[/[?&](file|path|template|q|search)=/i,3,'injection-prone'],
  [/\/upload|\/import|\/file/i,3,'upload surface'],[/\/oauth|\/login|\/token|\/reset|\/auth/i,3,'auth surface'],
  [/\/export|\/download|\/report/i,3,'bulk egress']];
function smellScore(label){let sc=0,top='';for(const[rx,w,r]of SMELL_RULES){if(rx.test(label)){sc+=w;if(w>=4&&!top)top=r;}}return{sc,top};}
function surfaceTree(){
  const hosts={};
  activeSessions().forEach(s=>{
    const cov=coverageFor(s), ad=agentData(s);
    const paramOf={}; (ad.surface||[]).forEach(x=>{paramOf[x.ep]=x.param;});
    cov.items.forEach(it=>{
      const host = it.type==='host' ? it.label : s.scope;
      const cells=Object.values(it.cells||{});
      const tot=cells.length||1, tested=cells.filter(c=>c.st==='tested'||c.st==='finding').length;
      const finds=cells.filter(c=>c.st==='finding').length;
      const key = it.type==='host' ? it.label : it.label;
      (hosts[host]=hosts[host]||[]).push({huntId:s.id, label:it.label, type:it.type,
        cov:Math.round(tested/tot*100), findings:finds, smell:smellScore(it.label),
        param:paramOf[it.label]||'', cells:it.cells, classes:it.ap});
    });
  });
  return hosts;
}

  const pass=(n)=>{if(WB.filter==='untested')return n.cov<100;if(WB.filter==='smelly')return n.smell.sc>=4;if(WB.filter==='findings')return n.findings>0;return true;};

    <div class="section-label" style="padding:0 4px">Next best actions</div>
    <div class="table-glass">${acts.slice(0,5).map(a=>`<div class="act" onclick="${a.onclick}"><span class="act-ico sev-${a.sev}">${ic(a.ico)}</span><div class="act-main"><div class="act-t">${a.t}</div><div class="act-s">${a.sub}</div></div><span class="act-cta">${a.cta}</span></div>`).join('')||'<div class="empty-state">All clear.</div>'}</div>

}
function copilotPane(){
  const acts=nextActions();
  const s=WB.ep?sessions.find(x=>x.id===WB.ep.huntId):activeSessions()[0];
  const feed=activeSessions().flatMap(x=>x.findings.map(f=>({f,s:x}))).sort((a,b)=>({c:0,h:1,m:2,l:3,i:4}[a.f.sev]-{c:0,h:1,m:2,l:3,i:4}[b.f.sev])).slice(0,4);
  return `
    <div class="cp-sec"><div class="section-label" style="margin-bottom:8px">Co-pilot</div>
      <div class="cp-live"><span class="st-dot st-done"></span>engine idle · ${activeSessions().length} target-session(s)</div>
    </div>
    <div class="cp-sec"><div class="section-label" style="margin-bottom:8px">Next best actions</div>
      ${acts.slice(0,3).map(a=>`<div class="cp-act" onclick="${a.onclick}"><span class="cp-act-i sev-${a.sev}">${ic(a.ico)}</span><div class="act-main"><div class="act-t" style="font-size:12.5px">${a.t}</div><div class="act-s">${a.sub}</div></div></div>`).join('')||'<div style="color:var(--text3);font-size:12px;padding:6px 12px">All clear.</div>'}
    </div>
    <div class="cp-sec"><div class="section-label" style="margin-bottom:8px">Live findings</div>
      ${feed.map(x=>`<div class="cp-act" onclick="nav('report-view',{huntId:'${x.s.id}',sev:'${x.f.sev}',fi:${x.s.findings.indexOf(x.f)}})"><span class="sev-tag sev-${x.f.sev}">${x.f.label}</span><div class="act-main"><div class="act-t" style="font-size:12px">${x.f.title}</div></div></div>`).join('')||'<div style="color:var(--text3);font-size:12px;padding:6px 12px">None yet.</div>'}
    </div>
    ${s&&s.identities&&s.identities.length?`<div class="cp-sec"><div class="section-label" style="margin-bottom:8px">Identities</div>${s.identities.map(i=>`<div class="cp-live"><span class="st-dot ${i.exp&&i.exp<Date.now()?'':'st-done'}"></span>${i.name} · ${i.mask}</div>`).join('')}</div>`:''}`;
}
/* per-target notes (localStorage) */
function notesKey(){return 'huntr-notes-'+((!V.target||V.target==='all')?'global':V.target);}
function loadNotes(){try{return localStorage.getItem(notesKey())||'';}catch(e){return'';}}
function saveNotes(v){try{localStorage.setItem(notesKey(),v);}catch(e){}}
function notesPane(){
  const t=(!V.target||V.target==='all')?'all targets':V.target;
  return `<div class="ep"><div class="ep-h">Notes <span class="scope-tag">${t}</span></div>
    <div class="ep-sub">Your scratchpad for this target — saved locally, isolated per workspace.</div>
    <textarea class="notes-area" id="notes-area" spellcheck="false" placeholder="Endpoints to revisit, creds, ideas, what you ruled out…">${loadNotes().replace(/</g,'&lt;')}</textarea></div>`;
}

const PROG_META={

function renderPrograms(el){
  const list=targetsList();
  const rows=list.map(t=>{const m=PROG_META[t.key]||{platform:'—',max:'—',status:t.sessions.some(s=>s.status==='active')?'active':'idle',statusc:'var(--text3)',earned:0,dup:'—'};

  el.innerHTML=`
    <div class="view-title">Programs</div>
    <div class="view-sub">Every engagement in one place — scope, payout tier, status, earnings, dup-rate. Your bounty business.</div>
    <div class="count-strip" style="max-width:620px;margin-bottom:22px">
      <div class="count-tile"><div class="ct-n">${list.length}</div><div class="ct-l">Programs</div></div>
      <div class="count-tile"><div class="ct-n" style="color:var(--gold)">$${totalEarned.toLocaleString()}<span style="font-size:14px">+</span></div><div class="ct-l">Earned</div></div>
      <div class="count-tile"><div class="ct-n">${list.reduce((a,t)=>a+t.findings,0)}</div><div class="ct-l">Findings</div></div>
      <div class="count-tile"><div class="ct-n crit">${list.reduce((a,t)=>a+t.crit,0)}</div><div class="ct-l">Critical</div></div>
    </div>
    <div class="table-glass">
      <div class="table-head" style="display:grid;grid-template-columns:1.4fr 90px 80px 90px 100px;gap:10px;padding:12px 20px"><span>Program</span><span>Platform</span><span>Max</span><span>Status</span><span style="text-align:right">Earned</span></div>
      ${rows.map(r=>`<div class="pg-row" onclick="setTarget('${r.t.key.replace(/'/g,"\\'")}');nav('workbench')">
        <div><div class="pg-name">${r.t.key}</div><div class="pg-scope">${r.t.sessions.length} hunt${r.t.sessions.length!==1?'s':''} · ${r.t.findings} findings${r.t.crit?' · '+r.t.crit+' crit':''} · dup ${r.m.dup}</div></div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--text2)">${r.m.platform}</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--gold)">${r.m.max}</div>
        <div><span class="pg-badge" style="color:${r.m.statusc};background:rgba(255,255,255,0.05);border:1px solid var(--border2)">${r.m.status}</span></div>
        <div class="pg-earned">${r.m.earned?(r.cur+r.m.earned.toLocaleString()):'—'}</div>
      </div>`).join('')}
    </div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:14px">Click a program → jump into its isolated workbench.</div>`;
}
